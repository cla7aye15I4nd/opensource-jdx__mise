name: windows cache

# Trusted test runs build Windows on the self-hosted runners, which keep their own
# state and never save Swatinem/rust-cache. When the self-hosted queue is deep they
# overflow to windows-latest (see classify-changes in test-impl.yml), and those jobs
# can only restore a cache saved on main. Pushes to main rarely overflow, so without
# this workflow the hosted Windows jobs find no cache and build from scratch.
#
# This runs the whole test workflow on main with the Windows jobs on windows-latest,
# so build-windows, windows-unit and windows-lint save their caches under the same
# keys the overflowed runs restore. Running it daily also keeps the entries from
# being evicted after 7 days without use.
on:
  schedule:
    - cron: "41 7 * * *" # daily, 07:41 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  test:
    if: github.repository == 'jdx/mise'
    permissions:
      contents: read
      actions: read
    uses: $/.github/workflows/test-impl.yml
    with:
      trusted: true
      windows-hosted: true
    secrets:
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      MISE_GH_TOKEN: ${{ secrets.MISE_GH_TOKEN }}
      MISE_VERSIONS_API_SECRET: ${{ secrets.MISE_VERSIONS_API_SECRET }}
